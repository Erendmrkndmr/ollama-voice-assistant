<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Acme Assistant</title>
<style>
  :root{
    --bg:#0b1020; --card:#0f162b; --ink:#e8ecf4; --muted:#9aa4b2; --stroke:#1a2442;
    --brand:#4f7cff; --brand-ink:#f0f5ff; --chip:#162544; --chip-ink:#9ecbff;
    --ok:#22c55e; --warn:#f59e0b; --danger:#ef4444;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial}
  .wrap{max-width:980px;margin:0 auto;padding:16px}
  .card{background:var(--card);border:1px solid var(--stroke);border-radius:16px;
        box-shadow:0 10px 30px rgba(0,0,0,.28);padding:16px}
  h1{margin:0 0 6px;font-size:22px}
  .muted{color:var(--muted);font-size:13px}
  .chip{font-size:11px;padding:2px 6px;border-radius:999px;background:var(--chip);color:var(--chip-ink)}
  .chat{height:56vh;min-height:360px;background:#0a0f20;border:1px solid var(--stroke);
        border-radius:12px;padding:12px;overflow:auto;margin-top:12px}
  .msg{display:flex;gap:10px;margin:10px 0}
  .bubble{padding:10px 12px;border-radius:12px;border:1px solid var(--stroke);max-width:80%}
  .msg.user .bubble{background:#13203f}
  .msg.agent .bubble{background:#162544}
  .controls{position:sticky;bottom:0;margin-top:12px;padding-top:12px;border-top:1px solid var(--stroke)}
  .grid{display:grid;gap:10px;grid-template-columns:repeat(12,1fr)}
  .span-6{grid-column:span 6}.span-4{grid-column:span 4}.span-3{grid-column:span 3}.span-2{grid-column:span 2}
  label{font-size:12px;color:#aeb7c4;display:block;margin-bottom:6px}
  select,input[type=text],textarea{
    width:100%;background:#0f1526;color:var(--ink);border:1px solid var(--stroke);
    border-radius:10px;padding:8px 10px;outline:none
  }
  textarea{min-height:60px;resize:vertical}
  .row{display:flex;gap:8px;align-items:center}
  .right{margin-left:auto}
  button{
    background:var(--brand);color:#fff;border:0;border-radius:10px;
    padding:8px 12px;font-weight:600;cursor:pointer;transition:transform .06s ease,opacity .2s;
  }
  button.small{padding:6px 10px;border-radius:9px;font-size:13px}
  button.ghost{background:transparent;border:1px solid var(--stroke);color:#cbd5e1}
  button:active{transform:translateY(1px)} button:disabled{opacity:.55;cursor:not-allowed}
  .kbd{font:12px/1.2 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
       padding:2px 6px;border:1px solid var(--stroke);background:#0f1526;border-radius:6px;color:var(--muted)}
  /* Mic button styles */
  .mic{display:inline-flex;align-items:center;gap:6px}
  .dot{width:10px;height:10px;border-radius:50%;background:#6b7280;transition:background .15s, box-shadow .15s}
  .mic.rec .dot{background:#ef4444; box-shadow:0 0 0 6px rgba(239,68,68,.12)}
  .pulse{position:relative}
  .pulse::after{
    content:"";position:absolute;inset:-6px;border:2px solid rgba(239,68,68,.25);border-radius:999px;
    animation:pulse 1.2s ease-out infinite;opacity:0
  }
  .mic.rec .pulse::after{opacity:1}
  @keyframes pulse{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.3);opacity:0}}
  .status{font-size:12px;color:var(--muted);min-height:18px}
  .status.ok{color:var(--ok)} .status.warn{color:var(--warn)} .status.err{color:var(--danger)}
  @media (max-width:780px){.grid{grid-template-columns:repeat(6,1fr)} .span-6,.span-4{grid-column:span 6} .span-3{grid-column:span 3}}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>Acme Assistant</h1>
    <div class="muted">Ollama-powered, persona-configurable assistant. Voice optional.</div>

    <!-- CHAT ON TOP -->
    <div id="chatBox" class="chat"></div>

    <!-- CONTROLS BELOW -->
    <div class="controls">
      <div class="grid">
        <div class="span-3">
          <label>Persona</label>
          <select id="personaSel">
            <option>Customer Support</option>
            <option selected>DevOps Advisor</option>
            <option>Technical Coach</option>
          </select>
        </div>
        <div class="span-4">
          <label>Directive</label>
          <input id="directive" type="text" value="Be concise and friendly."/>
        </div>
        <div class="span-3">
          <label>Model</label>
          <select id="modelSel">
            <option>phi3:mini</option>
            <option>llama3:8b</option>
            <option>mistral:7b</option>
          </select>
        </div>
        <div class="span-2">
          <label>Voice Input</label>
          <div class="row">
            <select id="langSel" style="flex:1">
              <option value="en-US" selected>English</option>
              <option value="tr-TR">Turkish</option>
            </select>
            <button id="micBtn" class="small mic" title="Hold to talk / Click to toggle">
              <span class="dot pulse"></span> <span class="micLabel">Mic</span>
            </button>
          </div>
          <div id="micStatus" class="status"></div>
        </div>

        <div class="span-6">
          <label>Message</label>
          <textarea id="msgInput" placeholder="Type or use mic…"></textarea>
          <div class="muted" style="margin-top:6px">Tip: Press <span class="kbd">Ctrl</span> + <span class="kbd">Enter</span> to send</div>
        </div>
        <div class="span-6 row">
          <label class="row" style="gap:6px;margin-right:auto">
            <input id="speakChk" type="checkbox" style="accent-color:var(--brand)"/>
            <span class="muted">Speak replies</span>
          </label>
          <button id="clearBtn" class="ghost small">Clear</button>
          <button id="sendBtn" class="small">Send</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const chatBox   = document.getElementById('chatBox');
const personaSel= document.getElementById('personaSel');
const directive = document.getElementById('directive');
const modelSel  = document.getElementById('modelSel');
const langSel   = document.getElementById('langSel');
const msgInput  = document.getElementById('msgInput');
const sendBtn   = document.getElementById('sendBtn');
const clearBtn  = document.getElementById('clearBtn');
const speakChk  = document.getElementById('speakChk');
const micBtn    = document.getElementById('micBtn');
const micLabel  = micBtn.querySelector('.micLabel');
const micStatus = document.getElementById('micStatus');

function addMsg(role, text){
  const line = document.createElement('div');
  line.className = 'msg ' + (role==='user'?'user':'agent');
  const who = document.createElement('div');
  who.className = 'chip';
  who.textContent = role==='user' ? 'You' : 'Agent';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  line.appendChild(who); line.appendChild(bubble);
  chatBox.appendChild(line);
  chatBox.scrollTop = chatBox.scrollHeight;
}

async function send(){
  const message = msgInput.value.trim();
  if(!message) return;
  addMsg('user', message);
  msgInput.value = ''; sendBtn.disabled = true;

  const payload = {
    persona:  personaSel.value,
    directive: directive.value,
    message:  message,
    model:    modelSel.value,
    speak:    speakChk.checked
  };

  try{
    const res = await fetch('/chat', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(payload)
    });
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data = await res.json();
    addMsg('agent', data.response || '(no response)');
    if (data.audio_b64){
      const a = new Audio('data:audio/wav;base64,'+data.audio_b64);
      a.play().catch(()=>{});
    }
  }catch(e){
    addMsg('agent', '⚠️ '+e.message);
  }finally{
    sendBtn.disabled = false;
  }
}

sendBtn.onclick = send;
clearBtn.onclick = ()=>{chatBox.innerHTML='';};
msgInput.addEventListener('keydown', (e)=>{
  if((e.ctrlKey||e.metaKey) && e.key==='Enter'){ send(); }
});

/* ---------- Speech-to-Text (Web Speech API) ---------- */
let rec = null, recActive = false, pressHold = false;
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

function setMicState(active, text, cls){
  micBtn.classList.toggle('rec', active);
  micLabel.textContent = active ? 'Listening…' : 'Mic';
  micStatus.className = 'status ' + (cls || '');
  micStatus.textContent = text || '';
}

if(!SR){
  // Tarayıcı desteklemiyorsa mic’i pasifleştir
  micBtn.disabled = true;
  setMicState(false, 'Speech recognition not supported in this browser.', 'warn');
} else {
  rec = new SR();
  rec.continuous = false;
  rec.interimResults = true;

  function startRec(){
    if(recActive) return;
    try{
      rec.lang = langSel.value || 'en-US';
      rec.start();
      recActive = true;
      setMicState(true, 'Hold to talk, release to stop. Click to toggle.', 'ok');
    }catch(err){
      setMicState(false, 'Mic error: '+err.message, 'err');
    }
  }
  function stopRec(){
    if(!recActive) return;
    rec.stop();
  }

  rec.onresult = (e)=>{
    let final = '';
    for(let i=0;i<e.results.length;i++){
      const res = e.results[i];
      if(res.isFinal) final += res[0].transcript;
    }
    // Interim’leri inputta göster, final gelince sabitler
    const last = e.results[e.results.length-1];
    const text = last ? last[0].transcript : '';
    if(!final){
      msgInput.value = text; // interim
    } else {
      msgInput.value = final.trim();
    }
  };
  rec.onend = ()=>{
    const text = (msgInput.value || '').trim();
    recActive = false;
    setMicState(false, text ? 'Transcribed.' : 'No speech detected.', text ? 'ok':'warn');
    // push-to-talk modunda bırakınca otomatik gönder
    if(pressHold && text) send();
    pressHold = false;
  };
  rec.onerror = (e)=>{
    recActive = false;
    setMicState(false, 'Mic error: '+e.error, 'err');
  };

  // Push-to-talk (basılı tut)
  micBtn.addEventListener('mousedown', ()=>{ pressHold = true; startRec(); });
  micBtn.addEventListener('mouseup',   ()=>{ if(pressHold) stopRec(); });

  // Toggle (tıkla başlat/durdur)
  micBtn.addEventListener('click', (e)=>{
    // mousedown+mouseup ikilisinden gelen click’i göz ardı et
    if(pressHold){ pressHold=false; return; }
    if(recActive) stopRec(); else startRec();
  });
  // Dil değiştiğinde aktifse yeniden başlat
  langSel.addEventListener('change', ()=>{
    if(recActive){ stopRec(); setTimeout(startRec, 120); }
  });
}
</script>
</body>
</html>
